name: Tavern 26.2 Port CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port lab
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone official NeoForge 26.1.2 scaffold
        run: git clone --depth 1 --branch 26.1.2 https://github.com/KaleidoscopeMods/KaleidoscopeTavern.git upstream-official-26.1.2

      - name: Clone official 1.2.0 feature source
        run: git clone --depth 1 --branch 1.21.1 https://github.com/KaleidoscopeMods/KaleidoscopeTavern.git upstream-official-1.21.1

      - name: Clone Refabricated 26.2 API reference
        run: git clone --depth 1 --branch 26.2-fabric https://github.com/NightEpiphany/KaleidoscopeTavern-Refabricated.git upstream-refabricated-26.2

      - name: Prepare NeoForge 26.2 port workspace
        run: |
          python3 scripts/prepare_port.py
          python3 scripts/merge_120_fast.py
          python3 scripts/merge_120_fast_v2.py
          python3 scripts/merge_120_client.py

      - name: Show merge summary
        run: |
          echo "Merged file count:"
          wc -l merged-files.txt || true
          head -100 merged-files.txt || true

      - name: Validate Tavern 1.2 resources
        working-directory: work
        run: |
          set -e
          test -d src/main/resources/assets/kaleidoscope_tavern/blockstates
          test -d src/main/resources/assets/kaleidoscope_tavern/models
          test -d src/main/resources/assets/kaleidoscope_tavern/textures
          test -d src/main/resources/assets/kaleidoscope_tavern/items
          test -f src/main/resources/assets/kaleidoscope_tavern/sounds.json
          test -d src/main/resources/assets/kaleidoscope_tavern/sounds
          test -f src/main/resources/assets/kaleidoscope_tavern/blockstates/sandwich_board.json
          test -f src/main/resources/assets/kaleidoscope_tavern/models/block/sandwich_board.json
          grep -q 'registrar.playToClient(DrinkEffectSyncS2CMessage.TYPE' src/main/java/com/github/ysbbbbbb/kaleidoscopetavern/network/NetworkHandler.java
          grep -q 'registrar.playToServer(ClearShakerC2SMessage.TYPE' src/main/java/com/github/ysbbbbbb/kaleidoscopetavern/network/NetworkHandler.java
          test "$(find src/main/resources/data/kaleidoscope_tavern -type f | wc -l)" -gt 0

      - name: Compile common/server core
        id: compile
        working-directory: work
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --refresh-dependencies clean compileJava --stacktrace 2>&1 | tee ../compile.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Build JAR
        id: jar
        if: steps.compile.outcome == 'success'
        working-directory: work
        continue-on-error: true
        run: |
          ./gradlew --no-daemon jar --stacktrace 2>&1 | tee ../jar.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Dedicated server first boot and clean stop
        id: server_boot
        if: steps.jar.outcome == 'success' && !cancelled()
        working-directory: work
        continue-on-error: true
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          enable-rcon=true
          rcon.password=ci
          rcon.port=25575
          online-mode=false
          EOF
          rm -rf run/server/world run/server/logs
          ./gradlew --no-daemon runServer > ../server-first.log 2>&1 &
          SERVER_PID=$!
          for i in {1..75}; do grep -q "Done (" run/server/logs/latest.log 2>/dev/null && break; sleep 2; done
          grep -q "Done (" run/server/logs/latest.log
          python3 - <<'PY'
          import socket,struct,time
          def packet(i,t,s):
              b=s.encode()+b'\0\0'
              return struct.pack('<iii',len(b)+8,i,t)+b
          def recv(sock):
              n=struct.unpack('<i',sock.recv(4))[0]
              data=b''
              while len(data)<n: data+=sock.recv(n-len(data))
              return struct.unpack('<ii',data[:8]),data[8:-2].decode(errors='replace')
          s=socket.create_connection(('127.0.0.1',25575),10)
          s.sendall(packet(1,3,'ci')); recv(s)
          s.sendall(packet(2,2,'save-all')); recv(s)
          time.sleep(3)
          s.sendall(packet(3,2,'stop'))
          try: recv(s)
          except Exception: pass
          s.close()
          PY
          for i in {1..90}; do ! kill -0 $SERVER_PID 2>/dev/null && break; sleep 1; done
          ! kill -0 $SERVER_PID 2>/dev/null
          wait $SERVER_PID
          grep -q "All dimensions are saved" run/server/logs/latest.log
          test -f run/server/world/level.dat

      - name: Dedicated server same-world restart
        id: server_restart
        if: steps.server_boot.outcome == 'success' && !cancelled()
        working-directory: work
        continue-on-error: true
        run: |
          rm -rf run/server/logs
          ./gradlew --no-daemon runServer > ../server-restart.log 2>&1 &
          SERVER_PID=$!
          for i in {1..75}; do grep -q "Done (" run/server/logs/latest.log 2>/dev/null && break; sleep 2; done
          grep -q "Done (" run/server/logs/latest.log
          python3 - <<'PY'
          import socket,struct,time
          def packet(i,t,s):
              b=s.encode()+b'\0\0'
              return struct.pack('<iii',len(b)+8,i,t)+b
          def recv(sock):
              n=struct.unpack('<i',sock.recv(4))[0]
              data=b''
              while len(data)<n: data+=sock.recv(n-len(data))
              return struct.unpack('<ii',data[:8]),data[8:-2].decode(errors='replace')
          s=socket.create_connection(('127.0.0.1',25575),10)
          s.sendall(packet(1,3,'ci')); recv(s)
          s.sendall(packet(2,2,'save-all')); recv(s)
          time.sleep(3)
          s.sendall(packet(3,2,'stop'))
          try: recv(s)
          except Exception: pass
          s.close()
          PY
          for i in {1..90}; do ! kill -0 $SERVER_PID 2>/dev/null && break; sleep 1; done
          ! kill -0 $SERVER_PID 2>/dev/null
          wait $SERVER_PID
          grep -q "All dimensions are saved" run/server/logs/latest.log
          test -f run/server/world/level.dat

      - name: Collect compiler errors
        if: always()
        run: |
          grep -E "error:|cannot find symbol|does not exist|no suitable method|incompatible types|has private access|cannot be applied" compile.log > compile-errors.txt || true
          cp merged-files.txt port-merged-files.txt || true
          mkdir -p output
          cp compile.log compile-errors.txt port-merged-files.txt output/ || true
          cp jar.log output/ 2>/dev/null || true
          cp server-first.log server-restart.log output/ 2>/dev/null || true
          cp work/build/libs/*.jar output/ 2>/dev/null || true

      - name: Upload build/debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tavern-26.2-port-ci
          path: output/
          if-no-files-found: warn

      - name: Fail job if validation failed
        if: steps.compile.outcome != 'success' || steps.jar.outcome != 'success' || steps.server_boot.outcome != 'success' || steps.server_restart.outcome != 'success'
        run: exit 1
