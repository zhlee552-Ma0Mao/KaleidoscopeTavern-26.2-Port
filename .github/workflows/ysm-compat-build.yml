name: YSM 26.2 Compat Probe

on:
  push:
    branches:
      - ysm-26.2-compat
    paths:
      - 'ysm-compat/**'
      - '.github/workflows/ysm-compat-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build compat probe
        working-directory: ysm-compat
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload compat probe jar
        uses: actions/upload-artifact@v4
        with:
          name: ysm-26.2-compat-probe
          path: ysm-compat/build/libs/*.jar
          if-no-files-found: error
